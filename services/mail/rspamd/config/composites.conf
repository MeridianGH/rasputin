COMPOSITE_BULK_SPAM {
  expression = "BAYES_SPAM & MIME_HTML_ONLY & RCPT_COUNT_ONE & MISSING_XM_UA";
  score = 3.0;
  description = "Bulk spam pattern: bayes + html-only + single rcpt + no UA";
  policy = "leave";
}

COMPOSITE_REPLYTO_SPAM {
  expression = "BAYES_SPAM & HAS_REPLYTO & REPLYTO_DOM_NEQ_FROM_DOM";
  score = 2.5;
  description = "Mismatched Reply-To domain and positive Bayes classification";
  policy = "leave";
}
